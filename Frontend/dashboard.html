<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForms - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
</head>
<body class="bg-gray-50">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>
    
    <!-- Main Content -->
    <div class="lg:ml-64">
        <main class="p-4 md:p-6">
            <!-- Dashboard Header -->
            <div class="mb-6 md:mb-8">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-gray-800" id="dashboard-title">Dashboard</h1>
                        <p class="text-gray-600" id="dashboard-subtitle">Welcome back!</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <i class="fas fa-bell text-gray-500 text-xl cursor-pointer hover:text-green-600"></i>
                            <span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full"></span>
                        </div>
                        <div class="hidden md:block">
                            <button onclick="window.location.href='profile.html'" class="flex items-center gap-3 px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                                <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center">
                                    <i class="fas fa-user text-green-600"></i>
                                </div>
                                <span class="font-medium" id="user-name">Loading...</span>
                                <i class="fas fa-chevron-down text-gray-400"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Analytics Tabs (will be shown only when in analytics view) -->
            <div class="mb-6 hidden" id="analytics-tabs-container">
                <div class="border-b border-gray-200">
                    <nav class="flex flex-wrap gap-2" id="analytics-tabs">
                        <!-- Analytics tabs will be loaded here -->
                    </nav>
                </div>
            </div>

            <!-- Dashboard Content Container -->
            <div id="dashboard-content">
                <!-- Loading State -->
                <div class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-green-600"></div>
                    <p class="mt-4 text-gray-600">Loading dashboard...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="footer-container"></div>
    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Check authentication
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || !user.token) {
                window.location.href = 'auth.html';
                return;
            }

            // Load components
            await loadComponent('navbar', 'navbar-container');
            await loadComponent('sidebar', 'sidebar-container');
            await loadComponent('footer', 'footer-container');
            
            // Initialize dashboard
            initDashboard();
            
            // Set user name - ONLY if element exists
            const userNameElement = document.getElementById('user-name');
            if (userNameElement) {
                userNameElement.textContent = user.name || 'User';
            }
        });
    </script>
</body>
</html>
