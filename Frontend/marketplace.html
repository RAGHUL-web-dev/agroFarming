<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForms - Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
</head>
<body class="bg-gray-50">
    <div id="navbar-container"></div>

    <main class="container mx-auto px-4 py-6">
        <!-- Marketplace Header -->
        <div class="mb-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Marketplace</h1>
                    <p class="text-gray-600">Browse and buy directly from farmers</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <input type="text" placeholder="Search products..." 
                               class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 w-full md:w-64">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    </div>
                    <a href="cart-checkout.html" class="relative px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition duration-300 flex items-center gap-2">
                        <i class="fas fa-shopping-cart"></i>
                        Cart <span id="cart-count" class="bg-white text-green-600 text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
                    </a>
                </div>
            </div>

            <!-- Categories Filter -->
            <div class="mb-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-3">Categories</h2>
                <div class="flex flex-wrap gap-2">
                    <button onclick="filterCategory('all')" class="category-filter active px-4 py-2 bg-green-600 text-white rounded-lg">All</button>
                    <button onclick="filterCategory('crop')" class="category-filter px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Crops</button>
                    <button onclick="filterCategory('goat')" class="category-filter px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Goat</button>
                    <button onclick="filterCategory('cow')" class="category-filter px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Cow</button>
                    <button onclick="filterCategory('hen')" class="category-filter px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Hen</button>
                    <button onclick="filterCategory('duck')" class="category-filter px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Duck</button>
                    <button onclick="filterCategory('pig')" class="category-filter px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Pig</button>
                    <button onclick="filterCategory('rabbit')" class="category-filter px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Rabbit</button>
                </div>
            </div>

            <!-- Filters Row -->
            <div class="bg-white rounded-lg shadow p-4 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Price Range</label>
                        <div class="flex items-center gap-2">
                            <input type="number" placeholder="Min" class="w-full px-3 py-2 border border-gray-300 rounded">
                            <span class="text-gray-500">-</span>
                            <input type="number" placeholder="Max" class="w-full px-3 py-2 border border-gray-300 rounded">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                        <input type="text" placeholder="City, State" class="w-full px-3 py-2 border border-gray-300 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Quality</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded">
                            <option value="">All Grades</option>
                            <option value="premium">Premium</option>
                            <option value="grade-a">Grade A</option>
                            <option value="grade-b">Grade B</option>
                            <option value="standard">Standard</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Sort By</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded">
                            <option value="newest">Newest First</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="popular">Most Popular</option>
                            <option value="rating">Highest Rated</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-between items-center mt-4">
                    <button onclick="applyFilters()" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Apply Filters</button>
                    <button onclick="resetFilters()" class="text-gray-600 hover:text-gray-800">Reset All</button>
                </div>
            </div>
        </div>

        <!-- Products Grid -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-800">Available Products</h2>
                <p id="product-count" class="text-gray-600">Loading products...</p>
            </div>
            
            <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Product cards will be loaded here -->
                <div class="text-center py-12 col-span-full">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-green-600"></div>
                    <p class="mt-4 text-gray-600">Loading products...</p>
                </div>
            </div>

            <!-- Load More Button -->
            <div class="text-center mt-8 hidden" id="load-more-container">
                <button id="load-more-btn" class="px-6 py-3 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
                    Load More Products
                </button>
            </div>
        </div>
    </main>

    <!-- Product Detail Modal Container -->
    <div id="product-detail-modal"></div>

    <div id="footer-container"></div>
    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/marketplace.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Check authentication (buyer only)
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || !user.token) {
                window.location.href = 'auth.html';
                return;
            }
            if (user.role !== 'buyer') {
                window.location.href = 'dashboard.html';
                return;
            }

            // Load components
            await loadComponent('navbar', 'navbar-container');
            await loadComponent('footer', 'footer-container');
            
            // Initialize marketplace
            initMarketplace();
            
            // Update cart count
            updateCartCount();
        });
        
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            document.getElementById('cart-count').textContent = cart.length;
        }
    </script>
</body>
</html>
