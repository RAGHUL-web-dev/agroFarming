<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForms - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
</head>
<body class="bg-gray-50">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>
    
    <div class="lg:ml-64">
        <main class="p-4 md:p-6">
            <!-- Header -->
            <div class="mb-6 md:mb-8">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-gray-800">My Profile</h1>
                        <p class="text-gray-600">Manage your account and preferences</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="loadProfileView('edit')" 
                                class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                            <i class="fas fa-edit mr-2"></i> Edit Profile
                        </button>
                    </div>
                </div>
            </div>

            <!-- Profile Content -->
            <div class="max-w-4xl mx-auto">
                <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                    <!-- Profile Header -->
                    <div class="bg-gradient-to-r from-green-600 to-emerald-700 p-6 text-white">
                        <div class="flex flex-col md:flex-row items-center gap-6">
                            <div class="relative">
                                <div class="w-32 h-32 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center border-4 border-white/30">
                                    <i class="fas fa-user text-5xl"></i>
                                </div>
                                <button onclick="showAvatarModal()" 
                                        class="absolute bottom-2 right-2 w-10 h-10 bg-green-600 rounded-full flex items-center justify-center hover:bg-green-700">
                                    <i class="fas fa-camera text-white"></i>
                                </button>
                            </div>
                            <div class="text-center md:text-left">
                                <h2 id="profile-name" class="text-2xl font-bold mb-2">Loading...</h2>
                                <div class="flex items-center justify-center md:justify-start gap-4 mb-3">
                                    <span id="profile-role" class="px-3 py-1 bg-white/20 rounded-full text-sm">Loading...</span>
                                    <span id="profile-status" class="px-3 py-1 bg-white/20 rounded-full text-sm">
                                        <i class="fas fa-circle text-xs mr-1"></i> Loading...
                                    </span>
                                </div>
                                <p id="profile-email" class="opacity-90">Loading...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Profile Content Container -->
                    <div id="profile-content" class="p-6">
                        <!-- Loading State -->
                        <div class="text-center py-12">
                            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-green-600"></div>
                            <p class="mt-4 text-gray-600">Loading profile...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Profile Edit Modal Container -->
    <div id="profile-edit-modal"></div>
    <div id="avatar-modal-container"></div>

    <div id="footer-container"></div>
    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Check authentication
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || !user.token) {
                window.location.href = 'auth.html';
                return;
            }

            // Load components
            await loadComponent('navbar', 'navbar-container');
            await loadComponent('sidebar', 'sidebar-container');
            await loadComponent('footer', 'footer-container');
            
            // Initialize profile
            initProfile();
        });
    </script>
</body>
</html>
