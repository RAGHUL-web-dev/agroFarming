<div class="loading-overlay fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl shadow-xl p-8 flex flex-col items-center">
        <!-- Spinner -->
        <div class="w-16 h-16 border-4 border-green-200 border-t-green-600 rounded-full animate-spin mb-4"></div>
        
        <!-- Message -->
        <h3 class="text-lg font-semibold text-gray-800 mb-2">Loading</h3>
        <p class="text-gray-600 text-center loading-message">Please wait...</p>
        
        <!-- Optional Progress -->
        <div class="w-48 bg-gray-200 rounded-full h-2 mt-4 hidden">
            <div class="loading-progress bg-green-600 h-2 rounded-full" style="width: 0%"></div>
        </div>
    </div>
</div>

<script>
    function showLoading(message = 'Loading...') {
        let overlay = document.querySelector('.loading-overlay');
        if (!overlay) {
            // Create loading overlay if it doesn't exist
            const template = document.querySelector('.loading-overlay').cloneNode(true);
            overlay = template;
            overlay.classList.remove('hidden');
            document.body.appendChild(overlay);
        } else {
            overlay.classList.remove('hidden');
        }
        
        // Update message
        overlay.querySelector('.loading-message').textContent = message;
        
        return overlay;
    }
    
    function hideLoading() {
        const overlay = document.querySelector('.loading-overlay');
        if (overlay) {
            overlay.classList.add('hidden');
        }
    }
    
    function updateLoadingProgress(percent) {
        const overlay = document.querySelector('.loading-overlay');
        if (overlay) {
            const progressBar = overlay.querySelector('.loading-progress');
            const progressContainer = overlay.querySelector('.w-48');
            
            if (progressBar && progressContainer) {
                progressContainer.classList.remove('hidden');
                progressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
            }
        }
    }
    
    // Example usage:
    // showLoading('Processing your request...');
    // updateLoadingProgress(50);
    // hideLoading();
</script>
