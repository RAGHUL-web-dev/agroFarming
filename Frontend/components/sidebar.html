<script>
    function initSidebar() {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) return;

        // Set user info
        document.getElementById('sidebar-user-name').textContent = user.name || 'User';
        document.getElementById('sidebar-user-role').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
        
        // Set role-specific links
        const roleLinks = document.getElementById('role-specific-links');
        let linksHtml = '';
        
        if (user.role === 'farmer') {
            linksHtml = `
                <div class="mb-6">
                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Farmer</h4>
                    <ul class="space-y-2">
                        <li>
                            <a href="products-manager.html" class="sidebar-link">
                                <i class="fas fa-seedling"></i>
                                <span>My Products</span>
                            </a>
                        </li>
                        <li>
                            <a href="orders-manager.html" class="sidebar-link">
                                <i class="fas fa-shopping-cart"></i>
                                <span>Orders</span>
                                <span class="notification-badge" id="pending-orders-count">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="dashboard.html?view=analytics" class="sidebar-link">
                                <i class="fas fa-chart-line"></i>
                                <span>Analytics</span>
                            </a>
                        </li>
                    </ul>
                </div>
            `;
        } else if (user.role === 'buyer') {
            linksHtml = `
                <div class="mb-6">
                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Buyer</h4>
                    <ul class="space-y-2">
                        <li>
                            <a href="marketplace.html" class="sidebar-link">
                                <i class="fas fa-store"></i>
                                <span>Marketplace</span>
                            </a>
                        </li>
                        <li>
                            <a href="cart-checkout.html" class="sidebar-link">
                                <i class="fas fa-shopping-cart"></i>
                                <span>My Cart</span>
                                <span class="notification-badge" id="cart-items-count">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="orders-manager.html" class="sidebar-link">
                                <i class="fas fa-clipboard-list"></i>
                                <span>My Orders</span>
                            </a>
                        </li>
                        <li>
                            <a href="profile.html?tab=favorites" class="sidebar-link">
                                <i class="fas fa-heart"></i>
                                <span>Favorites</span>
                            </a>
                        </li>
                    </ul>
                </div>
            `;
        } else if (user.role === 'admin') {
            linksHtml = `
                <div class="mb-6">
                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Admin</h4>
                    <ul class="space-y-2">
                        <li>
                            <a href="admin-panel.html" class="sidebar-link">
                                <i class="fas fa-cogs"></i>
                                <span>Admin Panel</span>
                            </a>
                        </li>
                        <li>
                            <a href="admin-panel.html?section=users" class="sidebar-link">
                                <i class="fas fa-users"></i>
                                <span>User Management</span>
                            </a>
                        </li>
                        <li>
                            <a href="admin-panel.html?section=products" class="sidebar-link">
                                <i class="fas fa-seedling"></i>
                                <span>Product Moderation</span>
                            </a>
                        </li>
                        <li>
                            <a href="admin-panel.html?section=orders" class="sidebar-link">
                                <i class="fas fa-shopping-cart"></i>
                                <span>Order Oversight</span>
                            </a>
                        </li>
                    </ul>
                </div>
            `;
        }
        
        roleLinks.innerHTML = linksHtml;
        
        // Update notification counts
        updateSidebarNotifications();
    }

    function updateSidebarNotifications() {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) return;

        if (user.role === 'farmer') {
            // For farmer, update pending orders count
            fetchPendingOrdersCount();
        } else if (user.role === 'buyer') {
            // For buyer, update cart items count
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartCount = document.getElementById('cart-items-count');
            if (cartCount) {
                cartCount.textContent = cart.length;
                cartCount.style.display = cart.length > 0 ? 'flex' : 'none';
            }
        }
    }

    async function fetchPendingOrdersCount() {
        try {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.role !== 'farmer') return;

            const response = await fetch('http://localhost:5000/api/farmers/orders/pending-approval?limit=1', {
                headers: {
                    'Authorization': `Bearer ${user.token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                const pendingCount = data.total || 0;
                const pendingElement = document.getElementById('pending-orders-count');
                
                if (pendingElement) {
                    pendingElement.textContent = pendingCount;
                    pendingElement.style.display = pendingCount > 0 ? 'flex' : 'none';
                }
            }
        } catch (error) {
            console.error('Error fetching pending orders:', error);
        }
    }

    // Initialize sidebar
    initSidebar();
</script>
