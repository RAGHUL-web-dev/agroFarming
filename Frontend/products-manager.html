<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForms - Product Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
</head>
<body class="bg-gray-50">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>
    
    <div class="lg:ml-64">
        <main class="p-4 md:p-6">
            <!-- Header -->
            <div class="mb-6 md:mb-8">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Product Management</h1>
                        <p class="text-gray-600">Manage your agricultural products</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="loadProductManagerView('list')" 
                                class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                            <i class="fas fa-list mr-2"></i> My Products
                        </button>
                        <button onclick="loadProductManagerView('add')" 
                                class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                            <i class="fas fa-plus mr-2"></i> Add Product
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="mb-6">
                <div class="border-b border-gray-200">
                    <nav class="flex space-x-8">
                        <button onclick="switchProductTab('active')" 
                                class="product-tab py-2 px-1 border-b-2 font-medium text-sm active">
                            Active Products
                        </button>
                        <button onclick="switchProductTab('inactive')" 
                                class="product-tab py-2 px-1 border-b-2 font-medium text-sm">
                            Inactive Products
                        </button>
                        <button onclick="switchProductTab('low-stock')" 
                                class="product-tab py-2 px-1 border-b-2 font-medium text-sm">
                            Low Stock
                        </button>
                    </nav>
                </div>
            </div>

            <!-- Content Container -->
            <div id="product-manager-content">
                <!-- Loading State -->
                <div class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-green-600"></div>
                    <p class="mt-4 text-gray-600">Loading products...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="footer-container"></div>
    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products-manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Check authentication (farmer only)
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || !user.token) {
                window.location.href = 'auth.html';
                return;
            }
            if (user.role !== 'farmer') {
                window.location.href = 'dashboard.html';
                return;
            }

            // Load components
            await loadComponent('navbar', 'navbar-container');
            await loadComponent('sidebar', 'sidebar-container');
            await loadComponent('footer', 'footer-container');
            
            // Initialize product manager
            initProductManager();
        });
    </script>
</body>
</html>
