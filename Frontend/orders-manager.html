<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForms - Order Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
</head>
<body class="bg-gray-50">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>
    
    <div class="lg:ml-64">
        <main class="p-4 md:p-6">
            <!-- Header -->
            <div class="mb-6 md:mb-8">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-gray-800" id="orders-title">Orders</h1>
                        <p class="text-gray-600" id="orders-subtitle">Manage your orders</p>
                    </div>
                    <div class="flex gap-3">
                        <!-- Role-specific buttons will be added here -->
                    </div>
                </div>
            </div>

            <!-- Role-specific Tabs -->
            <div class="mb-6">
                <div class="border-b border-gray-200">
                    <nav class="flex flex-wrap gap-2" id="orders-tabs">
                        <!-- Tabs will be loaded dynamically based on role -->
                    </nav>
                </div>
            </div>

            <!-- Filters -->
            <div class="bg-white rounded-lg shadow p-4 mb-6">
                <div class="flex flex-col md:flex-row gap-4 justify-between">
                    <div class="flex flex-wrap gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Date Range</label>
                            <input type="date" class="px-3 py-2 border border-gray-300 rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                            <select id="status-filter" class="px-3 py-2 border border-gray-300 rounded">
                                <option value="">All Status</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex items-end">
                        <button onclick="applyOrderFilters()" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                            Apply Filters
                        </button>
                    </div>
                </div>
            </div>

            <!-- Orders Container -->
            <div id="orders-container">
                <!-- Loading State -->
                <div class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-green-600"></div>
                    <p class="mt-4 text-gray-600">Loading orders...</p>
                </div>
            </div>

            <!-- Empty State -->
            <div id="orders-empty" class="hidden text-center py-12">
                <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-inbox text-gray-400 text-3xl"></i>
                </div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">No Orders Found</h3>
                <p class="text-gray-600 max-w-md mx-auto">You don't have any orders yet. Start by browsing products or check back later.</p>
            </div>
        </main>
    </div>

    <!-- Order Detail Modal Container -->
    <div id="order-detail-modal"></div>

    <div id="footer-container"></div>
    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orders-manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Check authentication
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || !user.token) {
                window.location.href = 'auth.html';
                return;
            }

            // Load components FIRST
            await loadComponent('navbar', 'navbar-container');
            await loadComponent('sidebar', 'sidebar-container');
            await loadComponent('footer', 'footer-container');
            await loadComponent('modal', 'modal-container'); // Load modal component
            await loadComponent('toast', 'toast-container'); // Load toast component
            
            // Initialize orders manager AFTER components are loaded
            initOrdersManager();
        });
    </script>
</body>
</html>
